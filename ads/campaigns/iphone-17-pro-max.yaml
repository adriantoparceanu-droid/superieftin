# Direcția 2 din research v2 (decizia proprietarului, 2026-09-27): iPhone 17 Pro Max 256GB,
# DOAR căutări care conțin „preț” sau „256gb” (intenție de cumpărare, nu informativă).
# „iphone 17 pro max” simplu (201.000 căutări/lună) e lăsat intenționat pe dinafară.
#
# Landing: varianta Cosmic Orange 256GB (ITGalaxy pe site). Deep Blue 256GB apare ca sitelink.
# Modelul are 3 culori (Cosmic Orange, Deep Blue, Silver): căutările cu alte culori decât cea a
# landing-ului sunt excluse prin negative (blue/albastru, silver/argintiu) — cine caută „deep blue”
# nu ajunge pe pagina portocalie. Varianta aleasă e cea mai simplă (fără grup separat).
#
# Textele NU afirmă că produsul e redus acum (verdictul policy-reviewer B1, 2026-09-27): reducerea
# reală dispare când mediana de 30 de zile prinde prețul din urmă. Vorbim doar despre metodă și
# serviciu. ads:validate respinge formulările de reducere „de azi”; garda zilnică (ads-guard) pune
# grupul pe pauză dacă pagina de destinație nu mai e bună.
#
# Negativul „orange” (operatorul) NU e folosit aici: ar bloca și căutările după culoarea
# Cosmic Orange. În locul lui: expresii specifice operatorului + „abonament”.
# Câmpurile `id` / `budget_id` le completează ads:apply după crearea în Google Ads.

