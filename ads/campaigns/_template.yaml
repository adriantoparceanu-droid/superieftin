# ȘABLON — copiază fișierul, redenumește (ex. laptopuri.yaml) și completează.
# Câmpurile `id` / `budget_id` le completează automat ads:apply după crearea în Google Ads.
# Fișierele care încep cu „_” sunt ignorate de ads:validate / ads:plan / ads:apply.
# Verificare: cd worker && npm run ads:validate   (exemple complete: samsung-pliabile.yaml etc.)

campaign:
  name: "SE | Search | Laptopuri"          # prefix SE = superieftin, ușor de filtrat
  id: null
  budget_id: null
  status: PAUSED                           # rămâne PAUSED; activezi tu
  daily_budget: 30                         # RON, ≤ guardrails
  bidding:
    strategy: MAXIMIZE_CLICKS              # sau MANUAL_CPC
    max_cpc: 1.50                          # la MAXIMIZE_CLICKS = plafonul de CPC
  # exact_only: true                       # opțional: refuză orice cuvânt care nu e exact
  conversion_goal:                         # singura conversie a campaniei (identificată după ID; numele e doar etichetă)
    name: Comision afiliere
    conversion_action_id: "7799099014"
  targeting:
    countries: [RO]
    languages: [ro]
    location_mode: PRESENCE                # doar persoane aflate în România
    networks: { search: true, search_partners: false, display: false }
  source_research: ads/research/AAAA-LL-ZZ-laptopuri.md   # de unde vine decizia

  # text = broad (toate cuvintele, orice ordine), "text" = phrase, [text] = exact.
  # Obligatorii (ads:validate): gratis, second hand, folosit, service, reparatie, manual, driver,
  # olx, piese, cum, ce este, forum + brandurile retailerilor (emag, evomag, itgalaxy, ...).
  negative_keywords:                       # la nivel de campanie
    - gratis
    - second hand
    - folosit
    - service
    - reparatie
    - piese
    - driver
    - olx

  ad_groups:
    - name: "Reduceri laptop"
      id: null
      final_url: https://www.superieftin.ro/reduceri-reale/laptopuri
      keywords:
        phrase:
          - reducere laptop
          - laptop la reducere
          - oferte laptop
        exact:
          - reduceri laptopuri
      negative_keywords: []
      ads:
        - type: RSA
          id: null
          # Spre o pagină de PRODUS (/p/) nu afirma că e redus acum („sub mediană”, „reducere reală”,
          # „preț redus”, procente): reducerea dispare în câteva zile și anunțul devine fals.
          # ads:validate refuză asta; exemplul de mai jos e pentru o pagină de listă (/reduceri-reale/…).
          headlines:                       # max 30 caractere fiecare, 8–15 bucăți
            - Reduceri Reale la Laptopuri
            - Verificate față de Mediană
            - Istoric Preț 90 de Zile
            - Fără Reduceri False
            - Compară Mai Multe Magazine
            - Doar Prețuri Sub Mediană
            - Alertă Gratuită de Preț
            - Laptopuri Verificate Zilnic
          descriptions:                    # max 90 caractere fiecare, 3–4 bucăți
            - Comparăm prețul de azi cu mediana ultimelor 30 de zile. Vezi doar reduceri reale.
            - Istoric de preț pe 90 de zile și prețuri de la mai multe magazine online.
            - Setează o alertă și află când prețul laptopului dorit scade cu adevărat.
          path1: reduceri
          path2: laptopuri

  extensions:
    sitelinks:
      - text: Cum Verificăm Reducerile
        url: https://www.superieftin.ro/despre
      - text: Reduceri la Televizoare
        url: https://www.superieftin.ro/reduceri-reale/televizoare
    callouts:
      - Actualizat Zilnic
      - Istoric 90 de Zile
      - Fără Cont Necesar
    structured_snippets:                   # header valid în română, ex. Servicii / Modele / Tipuri / Mărci
      - header: Servicii
        values: [Istoric de preț 90 zile, Mediana pe 30 de zile, Alerte de preț]
