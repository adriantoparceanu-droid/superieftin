# Test pet din research 2026-10-03 (secțiunile 3.0 și 3.4) — decizia proprietarului, 4.10.2026:
# Royal Canin câini, saci de 15 kg. Proprietarul a confirmat că petmart / 2Performant permite
# Google Ads Search spre comparator (problema „pending_deletion” din raport e lămurită).
#
# ATENȚIE — e un test de DATE, nu o investiție: research-ul arată că la CPC ~1,2 lei și ~15 lei
# comision pe sac, ar trebui să cumpere ~10% dintre vizitatori ca să ieșim pe zero (realist 0,5–2%).
# De aceea: 15 lei/zi, 14 zile (plafon de cheltuială ~210 lei), CPC maxim 1,20 lei, DOAR exact
# match. Scopul e să aflăm CPC-ul real și dacă vine vreo comandă petmart prin noi.
#
# De ce CPC manual: contul nu are încă destule conversii. Strategiile automate (tROAS) au nevoie
# de ~30 de conversii reale ca să învețe; până atunci plafonăm noi prețul pe click.
# De ce câte un grup pe produs: fiecare cuvânt cheie duce pe pagina /p/ exactă a sacului de 15 kg
# (nu pe /c/hrana-uscata, sortată după preț, unde primele sunt plicuri mici).
#
# Texte: pe pet NU există azi nicio reducere reală (paginile arată „Preț în intervalul obișnuit”),
# deci fără „redus”, „reducere”, „sub mediană”, procente sau „cel mai mic preț” (regula 9, verdict
# B1). Fără afirmații de sănătate (spiritul regulii 8). Pe fiecare pagină există o singură ofertă
# (petmart.ro), deci NU scriem „compară mai multe magazine”. Ce e adevărat pe pagină (verificat
# 4.10.2026): prețul la petmart.ro „Verificat acum X ore”, istoricul prețului (min, max) —
# DOAR 2 zile de date (3–4.10.2026), deci fără „90 de zile” / „evoluție” (FAIL regula 9, 4.10.2026);
# mediana pe 30 de zile, alertă de preț gratuită pe Telegram sau email, fără cont.
# Marca „Royal Canin” apare în titlul fiecărei pagini (de semnalat la policy-reviewer).
# Câmpurile `id` / `budget_id` le completează ads:apply după crearea în Google Ads.

campaign:
  name: "SE | Search | Pet Royal Canin caini 15 kg"
  id: "24323451025"
  budget_id: "15916001666"
  status: PAUSED # rămâne PAUSED; activarea o faci tu în Google Ads
  daily_budget: 15 # lei/zi — test de 14 zile (~210 lei în total)
  bidding:
    strategy: MANUAL_CPC
    max_cpc: 2.00 # lei — 5.10.2026, decizia proprietarului: la 1,20 lei = 0 afișări (>90% licitații pierdute pe rang; Keyword Planner top-of-page minim 1,29–1,66 lei pe cuvintele cu volum). Plafon guardrails 3,00.
  exact_only: true # ads:validate refuză orice cuvânt care nu e exact
  conversion_goal:
    name: Comision afiliere # Profitshare + 2Performant (petmart e pe 2Performant)
