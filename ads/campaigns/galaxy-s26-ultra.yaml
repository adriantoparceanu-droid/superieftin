# Direcția 3 din research v2 (decizia proprietarului, 2026-09-27): Samsung Galaxy S26 Ultra.
# E la limita de rentabilitate (EPC/CPC 1,34), de aceea: DOAR exact match (exact_only) și CPC
# maxim mai mic (0,33 lei). „samsung galaxy s26 ultra” simplu (CPC până la 0,39) e lăsat afară.
#
# Landing: Cobalt Violet 256GB și 1TB (ITGalaxy pe site). Atenție (research §3.3): minimul pe
# 90 de zile a fost mai mic decât prețul de azi — deci NU scriem „cel mai mic preț”.
# Textele NU afirmă nici că produsul e redus acum (verdictul policy-reviewer B1, 2026-09-27):
# „sub mediană” devine fals când mediana de 30 de zile prinde prețul din urmă. Vorbim doar despre
# metodă și serviciu; ads:validate respinge formulările de reducere „de azi”, iar garda zilnică
# (ads-guard) pune grupul pe pauză dacă pagina de destinație nu mai e bună.
# Câmpurile `id` / `budget_id` le completează ads:apply după crearea în Google Ads.

