# Direcția 1 din research v2 (decizia proprietarului, 2026-09-27): Samsung pliabile —
# Galaxy Z Fold7 256GB și Galaxy Z Flip7 FE 256GB, doar la ITGalaxy pe site.
#
# De ce o campanie separată: bugetul se controlează pe fiecare direcție; dacă una pierde bani,
# o pui pe pauză fără să le atingi pe celelalte.
# De ce CPC manual: contul nu are încă nicio conversie. Strategiile automate (tROAS) au nevoie
# de ~30 de conversii reale ca să învețe; până atunci plafonăm noi prețul pe click.
# Câmpurile `id` / `budget_id` le completează ads:apply după crearea în Google Ads.
#
# Textele NU afirmă că produsul e redus acum (fără „sub mediană”, „reducere reală”, „preț redus”,
# procente): insigna „Reducere reală” dispare când mediana pe 30 de zile prinde prețul din urmă
# (5–14 zile), iar anunțul ar deveni fals (verdictul policy-reviewer B1, 2026-09-27). Vorbim doar
# despre metodă și serviciu (mediana pe 30 de zile, istoric 90 de zile, alertă de preț).
# ads:validate respinge automat formulările de reducere „de azi”; garda zilnică (ads-guard) pune
# grupul pe pauză dacă pagina de destinație nu mai e bună (404, fără stoc, noindex).

campaign:
  name: "SE | Search | Samsung pliabile"
  id: "24287130378"
  budget_id: "15909455461"
  status: PAUSED # rămâne PAUSED; activarea o faci tu în Google Ads
  daily_budget: 8 # lei/zi (guardrails: max 50/campanie, 150 total)
  bidding:
    strategy: MANUAL_CPC
    max_cpc: 0.35 # lei; se aplică pe fiecare grup de anunțuri
  conversion_goal:
    # singura conversie folosită de campanie
    name: Comision Profitshare
    conversion_action_id: "7799099014"
  targeting:
    countries: [ RO ]
    languages: [ ro ]
    location_mode: PRESENCE # doar persoane aflate în România (nu „interesate de”)
    networks:
      search: true
      search_partners: false
      display: false
  source_research: ads/research/2026-09-27-oportunitati-v2.md # secțiunea 3.1

  # Negative: text = broad (blochează orice căutare care conține toate cuvintele),
  # "text" = phrase, [text] = exact.
  negative_keywords:
    # de bază (în fiecare campanie)
    - gratis
    - second hand
    - folosit
    - service
    - reparatie
    - manual
    - driver
    - olx
    - piese
    - cum
    - ce este
    - forum
    # branduri de retaileri și operatori — doar ca negative
    - emag
    - evomag
    - evo mag
    - itgalaxy
    - '"it galaxy"'
    - vexio
    - citgrup
    - cit grup
    - forit
    - vegis
    - altex
    - flanco
    - '"media galaxy"'
    - orange
    - vodafone
    - telekom
    - digi
    - abonament
    # intenții care nu cumpără un telefon nou
    - husa
    - husă
    - folie
    - carcasa
    - incarcator
    - încărcător
    - baterie
    - display
    - ecran
    - sh
    - refurbished
    - reconditionat
    - review
    - pareri
    - păreri
    - specificatii
    - vs
    - comparatie
    - wallpaper
    - setari
    - resetare
    # alte generații / modele pe care nu le promovăm. Cele cu cifră separată sunt PHRASE:
    # ca broad, „fold 8” ar bloca orice căutare cu „fold” și „8” (ex. „z fold 7 8 gb ram”).
    - '"fold 8"'
    - fold8
    - '"flip 8"'
    - flip8
    - '"fold 6"'
    - '"flip 6"'
    - "[z flip 7]"
    - "[samsung z flip 7]"

  ad_groups:
    - name: "Z Fold7 - model și preț"
      id: "205710466212"
      final_url: https://www.superieftin.ro/p/telefon-mobil-galaxy-z-fold7-256gb-12gb-ram-dual-sim-5g-silver-shadow
      keywords:
        exact:
          - samsung z fold 7
          - samsung galaxy z fold 7
          - galaxy z fold7
          - galaxy z fold 7
          - samsung z fold 7 pret
          - z fold 7 pret
          - samsung z fold 7 256gb
        phrase:
          - fold 7 pret
          - z fold 7 256gb
          - fold 7 reducere
      negative_keywords:
        # pagina e varianta de 256GB
        - 512gb
        - 512 gb
        - 1tb
      ads:
        - type: RSA
          id: "826203647180"
          headlines:
            - Samsung Galaxy Z Fold7 256GB
            - Z Fold7 256GB Silver Shadow
            - Galaxy Z Fold7 12GB RAM
            - Istoricul prețului Z Fold7
            - Comparăm cu mediana pe 30 zile
            - Minim, maxim și mediană
            - Istoric de preț pe 90 de zile
            - Alertă de preț pe Telegram
            - Nu comparăm cu prețul vechi
            - Prețuri verificate zilnic
            - Vezi prețul Z Fold7 de azi
            - Află când se ieftinește
