# Direcția 1 din research v2 (decizia proprietarului, 2026-09-27): Samsung pliabile —
# Galaxy Z Fold7 256GB și Galaxy Z Flip7 FE 256GB, doar la ITGalaxy pe site.
#
# De ce o campanie separată: bugetul se controlează pe fiecare direcție; dacă una pierde bani,
# o pui pe pauză fără să le atingi pe celelalte.
# De ce CPC manual: contul nu are încă nicio conversie. Strategiile automate (tROAS) au nevoie
# de ~30 de conversii reale ca să învețe; până atunci plafonăm noi prețul pe click.
# Câmpurile `id` / `budget_id` le completează ads:apply după crearea în Google Ads.
#
# Anunțurile NU conțin procente (se schimbă zilnic). Afirmațiile „sub mediană” / „reducere reală”
# sunt adevărate cât timp pagina afișează insigna „Reducere reală” — ads:validate verifică asta
# live înainte de fiecare apply. Dacă reducerea dispare, anunțul trebuie pus pe pauză.

campaign:
  name: "SE | Search | Samsung pliabile"
  id: null
  budget_id: null
  status: PAUSED                  # rămâne PAUSED; activarea o faci tu în Google Ads
  daily_budget: 8                 # lei/zi (guardrails: max 50/campanie, 150 total)
  bidding:
    strategy: MANUAL_CPC
    max_cpc: 0.35                 # lei; se aplică pe fiecare grup de anunțuri
  conversion_goal:                # singura conversie folosită de campanie
    name: Comision Profitshare
    conversion_action_id: "7799099014"
  targeting:
    countries: [RO]
    languages: [ro]
    location_mode: PRESENCE       # doar persoane aflate în România (nu „interesate de”)
    networks:
      search: true
      search_partners: false
      display: false
  source_research: ads/research/2026-09-27-oportunitati-v2.md   # secțiunea 3.1

  # Negative: text = broad (blochează orice căutare care conține toate cuvintele),
  # "text" = phrase, [text] = exact.
  negative_keywords:
    # de bază (în fiecare campanie)
    - gratis
    - second hand
    - folosit
    - service
    - reparatie
    - manual
    - driver
    - olx
    - piese
    - cum
    - ce este
    - forum
    # branduri de retaileri și operatori — doar ca negative
    - emag
    - evomag
    - evo mag
    - itgalaxy
    - '"it galaxy"'
    - vexio
    - citgrup
    - cit grup
    - forit
    - vegis
    - altex
    - flanco
    - '"media galaxy"'
    - orange
    - vodafone
    - telekom
    - digi
    - abonament
    # intenții care nu cumpără un telefon nou
    - husa
    - husă
    - folie
    - carcasa
    - incarcator
    - încărcător
    - baterie
    - display
    - ecran
    - sh
    - refurbished
    - reconditionat
    - review
    - pareri
    - păreri
    - specificatii
    - vs
    - comparatie
    - wallpaper
    - setari
    - resetare
