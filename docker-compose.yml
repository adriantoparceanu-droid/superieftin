# Definitia productiei (folosita in Faza 4)
# Fara Caddy — CloudPanel/Nginx face reverse proxy spre portul 3000

# Nume de proiect fix: pastreaza volumele (superieftin_*) atasate indiferent
# de directorul din care rulezi compose (ex. dupa mutarea in /home/superieftin/app).
name: superieftin

services:
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        # NEXT_PUBLIC_* se inline-uiesc la build, nu la runtime
        - NEXT_PUBLIC_GA_MEASUREMENT_ID=${NEXT_PUBLIC_GA_MEASUREMENT_ID}
        - NEXT_PUBLIC_SITE_URL=${SITE_URL}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"  # accesibil doar local, Nginx face proxy
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - DOMAIN=${DOMAIN}
      - TELEGRAM_BOT_USERNAME=${TELEGRAM_BOT_USERNAME}
      - REVALIDATE_SECRET=${REVALIDATE_SECRET}
      - ADMIN_SESSION_SECRET=${ADMIN_SESSION_SECRET}
      - UPLOAD_DIR=/app/uploads
      # IndexNow (Bing) la publicarea ghidurilor — optional; gol = dezactivat
      - INDEXNOW_KEY=${INDEXNOW_KEY:-}
      # Protectia anti-roboti pe /go/ (docs/ops/nginx-access-log.md, lib/go-token.ts, lib/go-rate-limit.ts).
      # Toate optionale: gol = valoarea implicita din cod.
      - GO_TOKEN_SECRET=${GO_TOKEN_SECRET:-}
      - GO_TOKEN_CHECK=${GO_TOKEN_CHECK:-}
      - GO_TEST_TOKEN=${GO_TEST_TOKEN:-}
      - GO_RATE_PER_MIN=${GO_RATE_PER_MIN:-}
      - GO_RATE_PER_HOUR=${GO_RATE_PER_HOUR:-}
      - GO_TOKEN_RATE_PER_MIN=${GO_TOKEN_RATE_PER_MIN:-}
      - GO_TOKEN_RATE_PER_HOUR=${GO_TOKEN_RATE_PER_HOUR:-}
      - GO_RATE_REDIS_TIMEOUT_MS=${GO_RATE_REDIS_TIMEOUT_MS:-}
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - SCRAPE_INTERVAL_HOURS=${SCRAPE_INTERVAL_HOURS:-8}
      - SCRAPE_RATE_LIMIT_MS=${SCRAPE_RATE_LIMIT_MS:-2000}
      - AFFILIATE_NETWORK=${AFFILIATE_NETWORK}
      - AFFILIATE_ID=${AFFILIATE_ID}
      - PROFITSHARE_API_USER=${PROFITSHARE_API_USER}
      - PROFITSHARE_API_KEY=${PROFITSHARE_API_KEY}
      - TWOPERFORMANT_EMAIL=${TWOPERFORMANT_EMAIL}
      - TWOPERFORMANT_PASSWORD=${TWOPERFORMANT_PASSWORD}
      - TWOPERFORMANT_AFF_CODE=${TWOPERFORMANT_AFF_CODE}
      - FEED_SYNC_CRON=${FEED_SYNC_CRON:-0 4 * * *}
      - PRICE_CHECK_INTERVAL_HOURS=${PRICE_CHECK_INTERVAL_HOURS:-3}
      - PRICE_CHECK_LIMIT=${PRICE_CHECK_LIMIT:-150}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_BOT_USERNAME=${TELEGRAM_BOT_USERNAME}
      # Avertizari catre proprietar (Admin → Magazine & surse); gol = nu se trimit
      - TELEGRAM_ADMIN_CHAT_ID=${TELEGRAM_ADMIN_CHAT_ID:-}
      - SITE_URL=${SITE_URL}
      - REVALIDATE_SECRET=${REVALIDATE_SECRET}
      # Google Ads / tracking:sync (comisioane Profitshare → conversii). Implicit ADS_ENV=test =
      # doar validate_only (regula 4); trimiterea reala cere si TRACKING_SYNC_AUTO_SEND=1.
      # Credentiale lipsa → jobul logheaza „Google nesolicitat: …” si nu opreste worker-ul.
      - ADS_ENV=${ADS_ENV:-test}
      - GOOGLE_ADS_CLIENT_ID=${GOOGLE_ADS_CLIENT_ID:-}
      - GOOGLE_ADS_CLIENT_SECRET=${GOOGLE_ADS_CLIENT_SECRET:-}
      - GOOGLE_ADS_REFRESH_TOKEN=${GOOGLE_ADS_REFRESH_TOKEN:-}
      # Gol — nu folosim cont Manager (MCC)
      - GOOGLE_ADS_LOGIN_CUSTOMER_ID=${GOOGLE_ADS_LOGIN_CUSTOMER_ID:-}
      - GOOGLE_ADS_CUSTOMER_ID_PROD=${GOOGLE_ADS_CUSTOMER_ID_PROD:-}
      - GOOGLE_ADS_CONVERSION_ACTION_ID=${GOOGLE_ADS_CONVERSION_ACTION_ID:-}
      # Optional, doar pentru compatibilitate: din 9 sept. 2026 Google nu mai cere developer token
      - GOOGLE_ADS_DEVELOPER_TOKEN=${GOOGLE_ADS_DEVELOPER_TOKEN:-}
      - TRACKING_SYNC_AUTO_SEND=${TRACKING_SYNC_AUTO_SEND:-}
      - TRACKING_SYNC_CRON=${TRACKING_SYNC_CRON:-30 6 * * *}
      # Garda zilnica a reclamelor (ads-guard): verifica landing-urile grupurilor active si le pune
      # pe pauza daca nu mai corespund. In ADS_ENV=test pauza e reala DOAR cu ADS_GUARD_REAL_PAUSE=1
      # (acordul proprietarului; altfel validate_only + alerta Telegram). Nu activeaza nimic.
      - ADS_GUARD_CRON=${ADS_GUARD_CRON:-0 7 * * *}
      - ADS_GUARD_REAL_PAUSE=${ADS_GUARD_REAL_PAUSE:-}
      # Statistici GA4 pentru /admin/statistici (job ga4-sync, doar citire). Gol = jobul sare
      # linistit. Cheia contului de serviciu in base64 (vezi worker/src/lib/ga4/client.ts).
      - GA4_PROPERTY_ID=${GA4_PROPERTY_ID:-}
      - GA4_SERVICE_ACCOUNT_JSON=${GA4_SERVICE_ACCOUNT_JSON:-}
      - GA4_SYNC_CRON=${GA4_SYNC_CRON:-15 6 * * *}
      - GSC_SITE_URL=${GSC_SITE_URL:-}
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Serviciu one-shot pentru migratii — rulat cu: docker compose run --rm migrate
  migrate:
    build:
      context: .
      dockerfile: worker/Dockerfile
    command: ["node", "worker/dist/migrate.js"]
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    restart: no
    profiles:
      - tools

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-superieftin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-superieftin}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-superieftin}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Fara porturi publice — accesibil doar in reteaua Docker

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Fara porturi publice — accesibil doar in reteaua Docker

volumes:
  postgres_data:
  redis_data:
  uploads:
