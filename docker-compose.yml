# Definitia productiei (folosita in Faza 4)
# Fara Caddy — CloudPanel/Nginx face reverse proxy spre portul 3000

services:
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"  # accesibil doar local, Nginx face proxy
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - DOMAIN=${DOMAIN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - SCRAPE_INTERVAL_HOURS=${SCRAPE_INTERVAL_HOURS:-8}
      - SCRAPE_RATE_LIMIT_MS=${SCRAPE_RATE_LIMIT_MS:-2000}
      - AFFILIATE_NETWORK=${AFFILIATE_NETWORK}
      - AFFILIATE_ID=${AFFILIATE_ID}
      - PROFITSHARE_API_USER=${PROFITSHARE_API_USER}
      - PROFITSHARE_API_KEY=${PROFITSHARE_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Serviciu one-shot pentru migratii — rulat cu: docker compose run --rm migrate
  migrate:
    build:
      context: .
      dockerfile: worker/Dockerfile
    command: ["node", "worker/dist/migrate.js"]
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    restart: no
    profiles:
      - tools

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-superieftin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-superieftin}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-superieftin}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Fara porturi publice — accesibil doar in reteaua Docker

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Fara porturi publice — accesibil doar in reteaua Docker

volumes:
  postgres_data:
  redis_data:
